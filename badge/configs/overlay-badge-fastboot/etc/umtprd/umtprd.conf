#
# File: configs/overlay-badge-fastboot/etc/umtprd/umtprd.conf
# Purpose: uMTP-Responder configuration template.
#
#
# Badge Hack GDL 2026 — uMTP-Responder configuration
#
# This file is a template: S49mtp replaces @MTP_SERIAL@ with a stable
# serial derived from the SoC (or persisted in /userdata/.mtp_serial).
#

loop_on_disconnect 1
sync_when_close 0x1
umask 022

# Photos plus a writable configuration storage for live overlay editing.
storage "/userdata/photos" "Badge Hack GDL 2026 Photos" "rw"
storage "/userdata/badge" "Badge Config" "rw"

manufacturer "Electronic Cats"
product "Badge Hack GDL 2026"
serial "@MTP_SERIAL@"
firmware_version "Rev A"
interface "MTP"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"

usb_vendor_id  0x2207
usb_product_id 0x0019
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x3008

usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
